name: odds
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scrape.py
      - run: |
          git config user.name bot
          git config user.email bot@x.com
          git add -A
          git commit -m "odds" || exit 0
          git push
